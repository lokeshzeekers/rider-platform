# /etc/nginx/sites-available/track.zeekerstech.com
#
# Terminates HTTPS, serves the static frontend, and reverse-proxies /api and Socket.IO
# traffic to the Node.js app running on 127.0.0.1:4000 (never exposed publicly).
#
# Prerequisites:
#   - certbot --nginx -d track.zeekerstech.com   (issues and auto-configures SSL)
#   - Node app running under PM2 on 127.0.0.1:4000 (see ecosystem.config.js)
#   - Frontend static files deployed to /var/www/ridemesh/frontend

# ---- HTTP -> HTTPS redirect ----
server {
    listen 80;
    listen [::]:80;
    server_name track.zeekerstech.com;
    return 301 https://$host$request_uri;
}

# ---- HTTPS ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name track.zeekerstech.com;

    # Managed by certbot; paths shown are the certbot default locations.
    ssl_certificate     /etc/letsencrypt/live/track.zeekerstech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/track.zeekerstech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 6m; # slightly above MAX_UPLOAD_MB to leave headroom for multipart overhead

    # ---- Static frontend ----
    root /var/www/ridemesh/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # ---- REST API ----
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- Socket.IO (WebSocket upgrade) ----
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s; # keep long-lived WS connections open
    }

    access_log /var/log/nginx/ridemesh.access.log;
    error_log  /var/log/nginx/ridemesh.error.log;
}
